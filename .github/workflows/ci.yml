name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependencias sin vulnerabilidades conocidas
        run: npm audit --audit-level=high
      - name: Tipos (Astro + TypeScript)
        run: npm run check
      - name: Pruebas unitarias y validación del contenido
        run: npm test
      - name: Compilación con índice de búsqueda
        run: npm run build
      - name: Navegador para las pruebas de punta a punta
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta (escritorio y móvil)
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-trazas
          path: test-results
          retention-days: 7
